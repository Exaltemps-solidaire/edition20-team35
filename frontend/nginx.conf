# Sert l'export statique de Next.js (out/). Les routes /api/ et /_reveil sont prises par le proxy d'entrée.
#
# En-têtes de sécurité et repli des routes profondes repris du gabarit de la plateforme
# (core-platform/templates/nginx.conf), avec la CSP adaptée : localhost:8501 et localhost:9000
# retirés (injoignables depuis le navigateur du visiteur), script-src ajouté explicitement
# ('self' + 'unsafe-inline' pour le bootstrap inline de Next.js), sinon tout script est bloqué
# et la page rend blanche sans erreur serveur.
#
# ⚠ nginx : une location qui déclare son propre add_header n'hérite plus de ceux du server.
# Les en-têtes de sécurité sont donc répétés dans /_next/static/ et /index.html.
server {
  listen 80;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; frame-ancestors 'none'" always;

  # Bundles hashés : immuables, cache long.
  location /_next/static/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; frame-ancestors 'none'" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # index.html : jamais mis en cache, sinon un onglet ouvert recharge un ancien bundle après déploiement.
  location = /index.html {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # Contrôles de santé : fichiers statiques public/health et public/sante.
  location ~ ^/(health|sante)$ {
    default_type text/plain;
  }

  # Repli des routes profondes vers index.html (export statique multi-pages, sans routeur client pour l'instant).
  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }
}
